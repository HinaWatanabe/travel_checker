<!DOCTYPE html>
<html lang = "ja">

<head>
    <meta charset = "UTF-8">
    <title>カエル旅行チェッカー</title>
    <link rel = "stylesheet" href = "style.css">
    <script src = "app.js" defer></script>
</head>

<body>
    <h1>🐸 カエルの旅行先チェッカー 🐸🐸</h1>

    <section>
        <h2>記録の追加</h2>
        <label>
            都道府県：
            <select id = "pref-select"></select>
        </label>
        <br>
        <label>
            日付：
            <input type = "date" id = "visit-date">
        </label>
        <br>
        <button id = "add-btn">記録</button>
        <button id = "edit-mode">編集</button>
    </section>

    <section>
        <h2>日本地図</h2>
        <div id="map" style="width: 100%; max-width: 600px; margin: 20px auto;"></div>
    </section>    

    <section>
        <h2>訪問履歴</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>都道府県</th>
                    <th>日付</th>
                </tr>
            </thead>
            <tbody id = "visit-table-body"></tbody>
        </table>

        </tbody>
    </section>

    <section>
        <h2>カエルの成長度</h2>
        <table>
            <thead>
              <tr>
                <th>都道府県</th>
                <th>訪問回数</th>
                <th>成長段階</th>
                <th>カエルの種類</th>
              </tr>
            </thead>
            <tbody id = "frog-stats-body">

            </tbody>
        </table>
    </section>

    <section>
        <h2>今日のおすすめカエルスポット</h2>
        <p id = "frog-rec">読み込み中...🐸</p>
    </section>
</body>

</html>
